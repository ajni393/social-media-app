spring:
  application:
    name: knot-social
  datasource:
    url: jdbc:postgresql://localhost:5432/knot_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
    show-sql: false
  flyway:
    locations: classpath:db/migration
    baselineOnMigrate: true

server:
  port: 8080
  servlet:
    context-path: /

jwt:
  secret: mySecretKeyForKnotSocialMediaAppPleaseChangeThisInProduction123456789
  expiration: 86400000

logging:
  level:
    root: INFO
    com.knot: DEBUG
